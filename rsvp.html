<script>
(function () {
  const currentPage =
    window.location.pathname.split("/").pop() || "index.html";

  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(link => {
    const href = link.getAttribute("href");

    if (
      (currentPage === "index.html" && href === "./") ||
      href === "./" + currentPage
    ) {
      link.classList.add("active");
    }
  });
})();
</script>
